<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlantı yok</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; text-align: center; background: #F7F6F2; color: #222624;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.65;
  }
  .kutu { max-width: 34ch; }
  .ikon {
    width: 56px; height: 56px; margin: 0 auto 24px; display: grid;
    place-items: center; border-radius: 16px; background: #EDF1EE; color: #5A7D6A;
  }
  h1 { font-size: 1.5rem; margin: 0 0 12px; font-weight: 600; }
  p { color: #6E7571; margin: 0 0 28px; }
  a {
    display: inline-block; padding: 13px 26px; border-radius: 999px;
    background: #5A7D6A; color: #fff; text-decoration: none; font-weight: 500;
  }
  .acil { margin-top: 28px; font-size: .875rem; color: #6E7571; }
  .acil a { background: none; color: #5A7D6A; padding: 0; text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #0F1412; color: #E8EDEA; }
    .ikon { background: #1A2421; color: #7FB3A5; }
    p, .acil { color: #96A19C; }
    a { background: #7FB3A5; color: #0F1412; }
    .acil a { background: none; color: #7FB3A5; }
  }
</style>
</head>
<body>
  <div class="kutu">
    <div class="ikon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M1 1l22 22M16.7 16.7A10.9 10.9 0 0 1 12 18M5 12.5a10.9 10.9 0 0 1 4-2.8M10.7 5.1A15.9 15.9 0 0 1 22 8.8M2 8.8a15.9 15.9 0 0 1 3.3-2.1"/>
        <circle cx="12" cy="20" r=".5" fill="currentColor"/>
      </svg>
    </div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Sayfayı görüntülemek için bağlantınızı kontrol edip tekrar deneyin.</p>
    <a href="/">Yeniden dene</a>
    <p class="acil">
      Acil bir durumsa lütfen kliniği arayın:<br>
      <a href="tel:+905320000000">0532 000 00 00</a>
    </p>
  </div>
</body>
</html>
