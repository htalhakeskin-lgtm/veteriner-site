<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Randevu Al — Klinik Adı Veteriner Kliniği</title>
  <meta name="description" content="Klinik Adı veteriner kliniğinden kolayca online randevu alın. Hekim seçin, tarih belirleyin ve onaylayın.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/randevu.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--color-background-alt);">

  <div id="main-header-placeholder"></div>

  <section class="section" style="padding-top: 130px;">
    <div class="randevu-container">
      <div class="text-center mb-5">
        <span class="badge badge-primary">Online Randevu Sistemi</span>
        <h1 class="font-heading" style="font-size: var(--font-4xl); color: var(--color-secondary); margin-top: 8px;">Randevunuzu Kolayca Oluşturun</h1>
        <p class="text-muted" style="max-width: 540px; margin: 8px auto 0 auto;">Adım adım ilerleyerek evcil hayvanınız için en uygun muayene saatini seçebilirsiniz.</p>
      </div>

      <!-- Wizard Progress Tracker Bar -->
      <div class="wizard-progress">
        <div class="wizard-progress-bar"></div>
        <div class="progress-step active"><span class="step-title">Hizmet</span>1</div>
        <div class="progress-step"><span class="step-title">Hekim</span>2</div>
        <div class="progress-step"><span class="step-title">Tarih & Saat</span>3</div>
        <div class="progress-step"><span class="step-title">Hasta Bilgileri</span>4</div>
        <div class="progress-step"><span class="step-title">Onay</span>5</div>
      </div>

      <!-- Wizard Card Body -->
      <div class="wizard-card">
        <div id="randevuStepContainer">
          <!-- Step content dynamically rendered by randevu.js -->
        </div>

        <div class="wizard-footer">
          <button class="btn btn-outline" id="wizardPrevBtn">← Geri</button>
          <button class="btn btn-primary" id="wizardNextBtn">İleri →</button>
        </div>
      </div>
    </div>
  </section>

  <div id="main-footer-placeholder"></div>

  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/header.js"></script>
  <script src="js/randevu.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
