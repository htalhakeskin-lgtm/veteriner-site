<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli — Klinik Yönetimi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <div class="admin-sidebar">
      <div>
        <div class="admin-brand">
          <span>🐾</span> Klinik Panel
        </div>
        <ul class="admin-nav">
          <li><a href="index.html" class="admin-nav-link active"><i>📅</i> Randevu Yönetimi</a></li>
          <li><a href="musteriler.html" class="admin-nav-link"><i>👥</i> Müşteri Listesi</a></li>
          <li><a href="../index.html" class="admin-nav-link" target="_blank"><i>🌐</i> Sitemize Git</a></li>
          <li><a href="#" class="admin-nav-link" onclick="AuthManager.logout()"><i>🚪</i> Çıkış Yap</a></li>
        </ul>
      </div>
      <div style="font-size: var(--font-xs); opacity: 0.6;">v1.0 Demo White-Label</div>
    </div>

    <!-- Main Content Area -->
    <div class="admin-main">
      <div class="admin-header">
        <div>
          <h1 class="font-heading" style="font-size: var(--font-3xl); color: var(--color-secondary);">Randevu Yönetim Takvimi</h1>
          <p class="text-muted">Gelen tüm online randevuları görüntüleyin ve onay durumlarını yönetin.</p>
        </div>
        <div class="status-badge status-confirmed">Sistem Aktif</div>
      </div>

      <div class="admin-table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Randevu ID</th>
              <th>Hasta (Hayvan)</th>
              <th>Hizmet</th>
              <th>Tarih & Saat</th>
              <th>Durum</th>
              <th>İşlemler</th>
            </tr>
          </thead>
          <tbody id="adminAppointmentsTableBody">
            <!-- Rendered by panel.js -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/panel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PanelManager.init();
    });
  </script>
</body>
</html>
