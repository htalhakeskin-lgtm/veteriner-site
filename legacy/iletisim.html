<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim & Konum — Klinik Adı Veteriner Kliniği</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="main-header-placeholder"></div>

  <section class="section" style="padding-top: 140px; background: var(--gradient-hero); color: #fff; text-align: center;">
    <div class="container">
      <span class="badge badge-accent">Bize Ulaşın</span>
      <h1 class="font-heading" style="font-size: var(--font-5xl); margin-top: 12px; color: #fff;">İletişim & Konum</h1>
      <p style="font-size: var(--font-lg); color: rgba(255,255,255,0.85); max-width: 600px; margin: 12px auto 0 auto;">Sorularınız, randevu talepleriniz veya acil durumlar için bize dilediğiniz zaman ulaşabilirsiniz.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info-card">
          <h3 class="font-heading" style="font-size: var(--font-2xl); color: var(--color-secondary);">Mesaj Gönderin</h3>
          <form onsubmit="event.preventDefault(); Utils.showToast('Mesajınız başarıyla iletildi!', 'success');">
            <div class="form-group">
              <label class="form-label">Adınız Soyadınız</label>
              <input type="text" class="form-control" required placeholder="Ahmet Yılmaz">
            </div>
            <div class="form-group">
              <label class="form-label">E-posta Adresi</label>
              <input type="email" class="form-control" required placeholder="ahmet@example.com">
            </div>
            <div class="form-group">
              <label class="form-label">Konu</label>
              <input type="text" class="form-control" placeholder="Muayene / Bilgi Almak İstiyorum">
            </div>
            <div class="form-group">
              <label class="form-label">Mesajınız</label>
              <textarea class="form-control" required placeholder="Mesajınızı detaylarıyla yazabilirsiniz..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Mesajı Gönder</button>
          </form>
        </div>

        <div class="map-wrapper">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12038.163618451197!2d28.9784!3d41.0082!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDHCsDAwJzfcNS41Ik4gMjhCsDU4JzQyLjIiRQ!5e0!3m2!1str!2str!4v1620000000000!5m2!1str!2str" allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </section>

  <div id="main-footer-placeholder"></div>

  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/header.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
