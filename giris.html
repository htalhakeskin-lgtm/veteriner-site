<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap — Klinik Adı Veteriner Kliniği</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="main-header-placeholder"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🐾</div>
        <h1 class="auth-title">Tekrar Hoş Geldiniz</h1>
        <p class="auth-subtitle">Evcil dostunuzun randevularını ve sağlık kartını takip edin.</p>
      </div>

      <form onsubmit="event.preventDefault(); const e = document.getElementById('loginEmail').value; const p = document.getElementById('loginPass').value; AuthManager.login(e, p);">
        <div class="form-group">
          <label class="form-label">E-posta Adresi</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="musteri@demo.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">
            Şifre
            <a href="sifre-sifirla.html" style="color: var(--color-primary); font-size: var(--font-xs);">Şifremi Unuttum?</a>
          </label>
          <input type="password" id="loginPass" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3" style="padding: 14px;">Giriş Yap</button>
      </form>

      <div class="demo-creds-hint">
        💡 <strong>Hızlı Demo Hesapları:</strong><br>
        • Müşteri Paneli: <code>musteri@demo.com</code> / <code>123456</code><br>
        • Admin Paneli: <code>admin@demo.com</code> / <code>admin123</code>
      </div>

      <div class="auth-footer-link">
        Hesabınız yok mu? <a href="kayit.html">Hemen Kayıt Olun →</a>
      </div>
    </div>
  </div>

  <div id="main-footer-placeholder"></div>

  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/header.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
